<!-- frontend/src/app/admin/login/login.component.html -->
<div class="login-container">
  <div class="login-card">
    <!-- Logo / Icono -->
    <div class="login-header">
      <div class="login-icon">
        <i class="bi bi-shield-lock"></i>
      </div>
      <h1>Panel de Administración</h1>
      <p class="subtitle">Accede para gestionar el contenido del hotel</p>
    </div>

    <!-- Mensaje de error -->
    <div *ngIf="error" class="error-message">
      <i class="bi bi-exclamation-circle"></i>
      {{ error }}
    </div>

    <!-- Formulario de login -->
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <div class="input-wrapper">
          <i class="bi bi-person"></i>
          <input
            type="text"
            id="usuario"
            [(ngModel)]="usuario"
            name="usuario"
            required
            placeholder="Introduce tu usuario"
            [disabled]="loading"
            autocomplete="username" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <i class="bi bi-lock"></i>
          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="Introduce tu contraseña"
            [disabled]="loading"
            autocomplete="current-password" />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePassword()"
            [disabled]="loading">
            <i [class]="mostrarPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="btn-login"
        [disabled]="loading || loginForm.invalid">
        <span *ngIf="!loading">
          <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
        </span>
        <span *ngIf="loading">
          <i class="bi bi-hourglass-split"></i> Verificando...
        </span>
      </button>
    </form>

    <!-- Enlace volver al inicio -->
    <div class="login-footer">
      <a routerLink="/" class="back-link">
        <i class="bi bi-arrow-left"></i> Volver al inicio
      </a>
    </div>
  </div>

  <!-- Footer decorativo -->
  <div class="login-bottom">
    <p>
      © {{ currentYear }} Hotel Amanecer en Campos. Todos los derechos
      reservados.
    </p>
  </div>
</div>
